<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CoolFix: mag-book ng aircon at ref technician na malapit sa'yo.">
<meta name="theme-color" content="#14378F">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/logo.png">
<title>CoolFix – Aircon at Ref Technician Malapit Sa'yo</title>
<style>
:root{--bg:#EEF4FC;--panel:#FFFFFF;--ink:#0C2370;--mute:#5A6B9A;--line:#D3DEF2;--blue:#2F7FE0;--orange:#14378F;--road:#FFFFFF;--block:#DCE7F7;--park:#C4DBF5;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#091233;--panel:#101C4A;--ink:#E8EFFF;--mute:#93A5D6;--line:#22336E;--blue:#5AA5F5;--orange:#8DBBFF;--road:#1A2A66;--block:#0B1640;--park:#10285C;--on:#091233}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{padding:14px 18px;display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:800}
header span{color:var(--mute);font-size:14px}
main{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;padding:0 14px 20px;max-width:1100px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.map{background:var(--block);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1}
.map svg{width:100%;height:100%;display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:300px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 11px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--on)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
.t{display:flex;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left}
.t:hover,.t.sel{background:var(--bg)}
.av{width:40px;height:40px;border-radius:50%;background:var(--blue);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.t b{display:block}.t small{color:var(--mute)}
.km{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.km small{display:block;font-weight:400}
.btn{width:100%;border:0;background:var(--orange);color:#fff;font:inherit;font-weight:700;padding:13px;border-radius:10px;cursor:pointer;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
h2{margin:0 0 6px;font-size:18px}
.mute{color:var(--mute)}
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{padding:7px 0 7px 26px;position:relative;color:var(--mute)}
.steps li:before{content:"";position:absolute;left:4px;top:13px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on:before{background:var(--blue);border-color:var(--blue)}
.eta{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
select,input{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.pin{cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes pulse{0%{r:8;opacity:.6}100%{r:26;opacity:0}}
[hidden]{display:none!important}
header{flex-wrap:wrap}
#auth{padding:0 14px}
.au{max-width:440px;margin:14px auto}
.au label{display:block;margin-top:10px;color:var(--mute);font-size:14px}
.err{color:#C62828;min-height:1.4em;margin:10px 0 0;font-size:14px;font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF8A80}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#1F1F1F;font:inherit;font-weight:600;cursor:pointer}
.or{text-align:center;color:var(--mute);font-size:13px;margin:14px 0 0}
.tabs{display:flex;gap:6px;padding:0 14px 10px;max-width:1100px;margin:0 auto}
.tab{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.badge{background:var(--orange);color:var(--on);border-radius:99px;padding:1px 7px;font-size:12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}.stats small{color:var(--mute);font-size:12px}
.hello{display:flex;flex-direction:column}.hello b{font-size:20px}.hello span{color:var(--mute);font-size:14px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}.av.big{width:56px;height:56px;font-size:20px}
.chat{display:flex;flex-direction:column}
.ch-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.msgs{display:flex;flex-direction:column;gap:8px;height:340px;overflow-y:auto;padding:12px 2px}
.b{max-width:80%;padding:9px 12px;border-radius:14px;overflow-wrap:anywhere}
.b small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.b.me{align-self:flex-end;background:var(--blue);color:var(--on);border-bottom-right-radius:4px}
.b.them{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.send{display:flex;gap:8px}
.au.wide{max-width:900px}
.s4{grid-template-columns:repeat(4,1fr)}
@media(max-width:620px){.s4{grid-template-columns:repeat(2,1fr)}}
.bars{display:flex;gap:8px;height:150px;align-items:flex-end;margin:10px 0}
.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
.bars small{color:var(--mute);font-size:12px}
.tw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg)}
.pill.ok{background:var(--park)}
.pill.no{background:transparent;border:1px solid var(--orange)}
.price{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px;border-radius:10px;background:var(--bg)}
.price b{font-size:22px}
.au .prow{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-size:16px;padding:6px 0;margin:0;border-bottom:1px solid var(--line)}
.prow input{width:110px;text-align:right}
.logo{width:44px;height:44px;border-radius:12px;flex:none;box-shadow:0 1px 4px rgba(12,35,112,.25)}.logo.big{width:96px;height:96px;border-radius:24px;display:block;margin:4px auto 14px}h1 i{font-style:normal}h1 .c{color:var(--ink)}h1 .f{color:var(--blue)}.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.cat{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}.cat b{font-size:16px}.cat small{color:var(--mute);font-size:12px}.cat span{color:var(--blue);font-weight:700;font-size:13px;margin-top:auto}.cat:hover,.sv:hover{border-color:var(--blue)}.gh{margin:14px 0 4px;color:var(--mute);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.sv{display:flex;justify-content:space-between;gap:10px;width:100%;margin-bottom:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}.sv b{white-space:nowrap}.sv[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--on)}.cat:focus-visible,.sv:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.ck{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.ck input{width:auto}.ck small{margin-left:auto;color:var(--mute)}.tabs{overflow-x:auto}.tab{flex:1 0 auto;white-space:nowrap}.ged{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px}.grow{display:flex;gap:6px;align-items:center}.grow input{flex:1;font-weight:700}.irow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.irow input,.irow select{flex:1 1 90px;min-width:0;width:auto}.irow input:first-child{flex:3 1 160px}.irow input[type=checkbox]{flex:none;width:auto}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
a{color:var(--blue)}
.jb{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<header><img id="hl" class="logo" src="img/logo.png" alt="Logo ng CoolFix" width="44" height="44"><h1><i class="c">Cool</i><i class="f">Fix</i></h1><span>Aircon at ref technician, malapit sa'yo</span><span id="who" style="margin-left:auto;color:var(--ink);font-weight:600"></span><button class="chip" id="lo" hidden>Mag-log out</button></header>
<nav id="tabs" class="tabs" hidden aria-label="Menu"></nav>
<div id="auth"><div class="panel au"><p class="mute">Naglo-load…</p></div></div>
<main id="app" hidden>
<div class="map" aria-label="Mapa ng mga technician">
<div id="gm" hidden style="position:absolute;inset:0"></div>
<svg viewBox="0 0 100 100" id="svg">
<rect width="100" height="100" fill="var(--block)"/>
<rect x="60" y="8" width="26" height="20" rx="2" fill="var(--park)"/>
<rect x="6" y="64" width="18" height="16" rx="2" fill="var(--park)"/>
<g stroke="var(--road)" stroke-width="3.2" stroke-linecap="square">
<path d="M0 20H100M0 50H100M0 80H100M20 0V100M50 0V100M80 0V100"/></g>
<g stroke="var(--road)" stroke-width="1.4"><path d="M0 35H100M0 65H100M35 0V100M65 0V100"/></g>
<g id="route"></g><g id="pins"></g>
<g id="me"><circle cx="50" cy="50" r="8" fill="var(--blue)" opacity=".5" style="animation:pulse 2s infinite"/>
<circle cx="50" cy="50" r="3.4" fill="var(--blue)" stroke="#fff" stroke-width="1.2"/></g>
<text x="50" y="58" text-anchor="middle" font-size="3.2" font-weight="700" fill="var(--ink)">Ikaw</text>
</svg>
</div>
<section class="panel" id="panel" aria-live="polite"></section>
</main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
